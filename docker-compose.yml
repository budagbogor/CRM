services:
  postgres:
    image: postgres:17-alpine
    container_name: autoretention-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoretention
      POSTGRES_PASSWORD: autoretention
      POSTGRES_DB: autoretention_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoretention -d autoretention_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    profiles:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://autoretention:autoretention@postgres:5432/autoretention_crm?schema=public
    ports:
      - "3000:3000"

volumes:
  postgres-data:
